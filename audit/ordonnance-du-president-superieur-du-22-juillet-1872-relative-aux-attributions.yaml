- article: "2"
  statut: modifie
  date: 2019-12-12
  source: "Décret n° 2019-1330 du 10 décembre 2019 portant mesures de déconcentration et de simplification relatives aux cultes catholique, protestants et israélite dans les départements du Bas-Rhin, du Haut-Rhin et de la Moselle, art. 5 (modification des art. 11, 12, 23 et 24 de l'ordonnance royale du 25 mai 1844)"
  jorf: JORFTEXT000039472929
  texte_actuel: ""
  texte_actuel_officiel: false
  note: "Le décret 2019-1330 vise expressément « l'ordonnance du président supérieur du 22 juillet 1872 [...] notamment son article 2 » sans la modifier dans son dispositif. L'art. 2 renvoie aux droits délégués au consistoire central par les art. 11 al. 2, 12 al. 4 phrase 2 et al. 6 à 8, et 23 al. 2 de l'ordonnance de 1844 : l'art. 11 a été remplacé (le préfet peut révoquer les membres du consistoire départemental ou le dissoudre), l'art. 12 modifié (préfet), l'art. 23 al. 1 supprimé. Ces renvois sont donc désormais sans objet ou obsolètes ; le préfet exerce directement ces compétences. Effet implicite, aucun texte ne réécrit l'art. 2. texte_actuel laissé vide."
  confiance: a_verifier

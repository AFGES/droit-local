# Source lue: JORFTEXT000031733082 (LFR 2015, art. 51-II), texte LEGIARTI000031757525. Insertion d'un titre III bis
# "De la gestion informatisee du cadastre" apres l'article 56 (avant le titre V). Entree en vigueur: lendemain de publication (JORF 30/12/2015).
- article: "56-1"
  statut: insere
  date: 2015-12-31
  source: "Loi n° 2015-1786 du 29 décembre 2015 de finances rectificative pour 2015, art. 51, II (titre III bis, art. 56-1)"
  jorf: JORFTEXT000031733082
  texte_actuel: |
    Le plan cadastral est géré par des procédés informatiques.

    Lorsqu’il est décrit par une série de coordonnées, le plan cadastral informatisé est rattaché au système national de référence de coordonnées géographiques, planimétriques et altimétriques prévu à l’article 89 de la loi n° 95-115 du 4 février 1995 d’orientation pour l’aménagement et le développement du territoire.
  texte_actuel_officiel: false
  note: "Titre III bis « De la gestion informatisée du cadastre », inséré après l'article 56 (titre III) et avant le titre V."
  confiance: haute
- article: "56-2"
  statut: insere
  date: 2015-12-31
  source: "Loi n° 2015-1786 du 29 décembre 2015, art. 51, II (art. 56-2)"
  jorf: JORFTEXT000031733082
  texte_actuel: |
    Outre le renouvellement et la conservation, le service du cadastre procède à l’adaptation géométrique des plans cadastraux afin d’améliorer leur cohérence entre eux et avec les données géographiques nationales de référence. L’adaptation géométrique des plans peut être opérée par des procédés informatiques.
  texte_actuel_officiel: false
  note: ""
  confiance: haute
- article: "56-3"
  statut: insere
  date: 2015-12-31
  source: "Loi n° 2015-1786 du 29 décembre 2015, art. 51, II (art. 56-3)"
  jorf: JORFTEXT000031733082
  texte_actuel: |
    La représentation au plan cadastral des limites de territoire peut être adaptée géométriquement afin qu’elle concorde avec les procès-verbaux de délimitation.

    La reconnaissance des limites entre les communes est effectuée au terme d’une procédure contradictoire par les communes concernées, à partir des procès-verbaux de délimitation.

    Le service du cadastre peut engager une nouvelle opération de reconnaissance pour mettre à jour les procès-verbaux de délimitation.

    Le service du cadastre met à jour la documentation cadastrale selon les énonciations des procès-verbaux de délimitation.
  texte_actuel_officiel: false
  note: ""
  confiance: haute
- article: "56-4"
  statut: insere
  date: 2015-12-31
  source: "Loi n° 2015-1786 du 29 décembre 2015, art. 51, II (art. 56-4)"
  jorf: JORFTEXT000031733082
  texte_actuel: |
    La date d’ouverture des travaux d’adaptation géométrique est fixée par arrêté préfectoral.

    Dans chaque commune, un arrêté du maire informe les propriétaires de la mise à disposition des résultats des travaux d’adaptation géométrique et de la période pendant laquelle ils peuvent formuler auprès du service local du cadastre des observations et des réclamations sur ces résultats.

    La durée de la mise à disposition des résultats, comprise entre un mois et trois mois selon le nombre de feuilles de plan et le nombre de propriétaires, est fixée par arrêté du ministre chargé du budget.

    La date d’entrée en vigueur du plan cadastral adapté géométriquement est fixée par arrêté préfectoral.

    Les arrêtés préfectoraux sont publiés au recueil des actes administratifs de la préfecture du département et affichés en mairie.
  texte_actuel_officiel: false
  note: "Arrêté d'application du 22 septembre 2017 (JORFTEXT000035744124) fixant la durée de mise à disposition (1 à 3 mois)."
  confiance: haute
- article: "56-5"
  statut: insere
  date: 2015-12-31
  source: "Loi n° 2015-1786 du 29 décembre 2015, art. 51, II (art. 56-5)"
  jorf: JORFTEXT000031733082
  texte_actuel: |
    Les propriétaires peuvent demander une rectification du plan adapté géométriquement. Ces réclamations sont présentées au service local du cadastre.
  texte_actuel_officiel: false
  note: ""
  confiance: haute
- article: "24"
  statut: modifie
  date: 2017-03-08
  source: "Loi n° 2017-285 du 6 mars 2017 visant à favoriser l'assainissement cadastral et la résorption du désordre de propriété, art. 6"
  jorf: JORFTEXT000034150658
  texte_actuel: |
    Les limites non contestées portées sur la carte dressée à la suite d’un arpentage parcellaire
    ont, à l’égard des détenteurs d’immeubles inscrits dans les livres cadastraux, la même portée par
    rapport à la possession et au droit de propriété que si elles avaient été fixées d’un commun
    accord entre eux. Il en est de même des limites inscrites provisoirement en vertu de l’article 17
    dans le cas où la preuve n’est pas fournie à l’administration chargée des travaux d’arpentage,
    avant l’expiration du délai de deux ans qui suit la communication officielle de la carte, que les
    détenteurs inscrits sur les livres cadastraux se sont entendus ou ont admis une autre limite ou
    qu’ils ont introduit une action judiciaire.

    Dans les publications annonçant l’ouverture des opérations d’arpentage ainsi que la
    communication de la carte, il y a lieu d’attirer particulièrement l’attention sur les conséquences
    juridiques prévues à l’alinéa 1er.

    Les deux premiers alinéas ne font pas obstacle à l’application du titre XXI du livre III du code civil.
  texte_actuel_officiel: false
  note: "Art. 6 de la loi 2017-285 : 1° le troisième alinéa (« On ne peut se prévaloir des empiètements au-delà des limites indiquées sur la carte pour prouver la possession ou l'acquisition de la propriété par prescription ») est remplacé par la phrase ci-dessus (renvoi à la prescription acquisitive, titre XXI du livre III du code civil) ; 2° le dernier alinéa (cartes reposant sur un arpentage commencé ou terminé depuis le 1er avril 1879) est supprimé. Les alinéas 1 et 2 sont ceux de la traduction officielle 2013, inchangés. Entrée en vigueur le 2017-03-08 (lendemain de la publication JORF du 7 mars 2017). Texte de la loi lu intégralement (JORFTEXT000034150658). Absent de la première passe."
  confiance: haute

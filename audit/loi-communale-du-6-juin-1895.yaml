  note: "L'article 9 figure en entier dans la liste d'abrogations du 22° de l'art. 12. Il figure pourtant dans la traduction 2013 : écart entre la liste de 1996 (numérotation) et le fichier md à vérifier sur Légifrance/IDL avant publication. Concordance : la suppléance du maire est aujourd'hui régie par CGCT L2122-17 (applicable en Alsace-Moselle, non exclu par L2541-1 : remplacement par un adjoint, à défaut par un conseiller désigné par le conseil ou pris dans l'ordre du tableau), ce qui est incompatible avec le texte local (conseiller désigné par le maire)."

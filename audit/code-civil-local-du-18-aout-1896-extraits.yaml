  statut: modifie
  date: 2020-01-01
  source: "Loi du 1er juin 1924, art. 74 à 77 (art. 75 dans sa rédaction de l'ordonnance n° 2019-964 du 18 septembre 2019, art. 35 V) ; loi n° 2019-222 du 23 mars 2019, art. 95 (COJ art. L. 215-6)"
  jorf: JORFTEXT000039110186
  texte_actuel_officiel: false
  note: "Art. 74 : arts 2353 à 2368 maintenus en vigueur, 'sans déroger aux règles du droit français concernant l'étendue des pouvoirs des exécuteurs testamentaires'. Art. 75 (depuis le 1er janvier 2020) : 'Le certificat d'héritier est délivré par le juge du tribunal judiciaire de l'ouverture de la succession.' (versions antérieures : 'tribunal d'instance du lieu de l'ouverture' 1924-1994 ; 'tribunal d'instance de l'ouverture' 1994-2019). 'tribunal de la succession' (md) se lit donc 'juge du tribunal judiciaire' dans tout le livre V. Art. 76 (depuis 1991-01-03) ajoute des mentions obligatoires (légataires universels assimilés aux héritiers ; legs particuliers d'immeubles ; régime de communauté). Art. 77 : certificat valant certificat de notoriété. Texte non reformulé dans le CCL."
  confiance: haute

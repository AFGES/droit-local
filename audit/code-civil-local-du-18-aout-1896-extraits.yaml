  jorf: JORFTEXT000000791289
  texte_actuel: |
    Si la déclaration est admise, le tribunal d’instance doit la communiquer à l’autorité
    administrative compétente.

    L’autorité administrative peut faire opposition contre l’inscription lorsque les buts de
    l’association sont contraires aux lois pénales réprimant les crimes et délits ou lorsque l’association
    aurait pour but de porter atteinte à l’intégrité du territoire et à la forme républicaine du
    Gouvernement.
  texte_actuel_officiel: false
  note: "Le md reflète DÉJÀ le texte 2003 pour l'alinéa 2 (identique). Alinéa 2 abrogé ensuite par l'ordonnance 2015-904 (entrée ci-dessous). 'tribunal d'instance' se lit 'tribunal judiciaire' depuis 2020 (entrée 'tout')."
  confiance: haute
- article: "61"
  statut: modifie
  date: 2015-07-25
  source: "Ordonnance n° 2015-904 du 23 juillet 2015, art. 2 (1°)"
  jorf: JORFTEXT000030921208
  texte_actuel: |
    Si la déclaration est admise, le tribunal d’instance doit la communiquer à l’autorité
    administrative compétente.
  texte_actuel_officiel: false

# ---------- Transfert de competence tribunal d'instance -> tribunal judiciaire ----------
- article: "tout"
  statut: modifie
  date: 2020-01-01
  source: "Loi n° 2019-222 du 23 mars 2019, art. 95 (I 42° : titre II du livre II du COJ abrogé ; I 37° : COJ art. L. 215-6 créé) et art. 109 (XXIII) ; Décret n° 2023-105 du 17 février 2023"
  jorf: JORFTEXT000038261631
  texte_actuel: ""
  texte_actuel_officiel: false
  note: "L'art. 95 (relu en entier) supprime le tribunal d'instance et crée l'art. L. 215-6 COJ : 'Le tribunal judiciaire connaît : 1° De la tutelle, des administrations légales et des curatelles de droit local ; 2° Du partage judiciaire et de la vente judiciaire d'immeubles, des certificats d'héritier et des scellés ; 3° Des registres des associations et des registres des associations coopératives de droit local.' Les mentions 'tribunal d'instance' des art. 29, 37, 50, 55, 60, 61, 66, 69, 72, 73, 78, 79, 79-I se lisent 'tribunal judiciaire' ; 'tribunal de grande instance' (art. 62 de 2015) idem. Aucun texte ne réécrit littéralement ces articles du code civil local : lecture par transfert de compétence, pas modification textuelle."
  confiance: moyenne

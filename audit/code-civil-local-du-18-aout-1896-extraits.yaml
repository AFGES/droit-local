  note: "Abrogation du 'dernier membre de phrase du second alinéa'. La portée exacte n'est pas établie : le texte local pré-2003 de l'alinéa n'est pas disponible dans les sources officielles consultées (PPL Sénat 97-189 parle de la dernière phrase de l'alinéa, relative à l'approbation de l'Etat en cas de concession). Le md montre l'alinéa 2 'Lorsque la capacité juridique ... concession, l'approbation de l'Etat est exigée pour toute modification des statuts.' : il peut être déjà amputé ou encore intact. Non conclu."

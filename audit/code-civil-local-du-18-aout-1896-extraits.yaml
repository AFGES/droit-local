# ---------- Art. 25 ----------
- article: "25"
  statut: modifie
  date: 2003-08-03
  source: "Loi n° 2003-709 du 1er août 2003, art. 20 (II)"
  jorf: JORFTEXT000000791289
  texte_actuel: |
    La constitution statutaire d’une association est établie par les statuts de l’association, en tant qu’elle ne se fonde pas sur les dispositions qui
    suivent.
  texte_actuel_officiel: false
  note: "La loi supprime les mots 'ayant la capacité juridique' ; le md porte 'ayant la capacité de jouissance des droits' (traduction 2013 de la même locution), donc suppression non reflétée dans le md. Texte reconstitué en retirant ces mots du md, non confronté à la consolidation Légifrance."
  confiance: moyenne

# ---------- Art. 33 ----------
- article: "33 (al. 2)"
  statut: modifie
  date: 2003-08-03
  source: "Loi n° 2003-709 du 1er août 2003, art. 21 ('le dernier membre de phrase du second alinéa de l'article 33')"
  jorf: JORFTEXT000000791289

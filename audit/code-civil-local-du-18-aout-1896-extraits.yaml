# Audit modifications, 2e passe : toutes dates (1924 a 2026-11-19). Entrees par article, ordre chronologique.
# ATTENTION origine du md : le decret 2013-776 dit retenir la version maintenue par les lois du 1er juin 1924, sans les modifications ulterieures.
# Pourtant le md contient deja le texte issu de la loi 2003-709 pour les art. 42, 54, 61 al. 2, 63, 77, 78, 79-I a 79-III, et ne contient plus
# 23, 44, l'ancien al. 2 de 43 : ces textes ne font donc pas partie de la traduction officielle 2013 (texte_actuel_officiel: false), l'annexe du decret n'ayant pas pu etre consultee.
# Les entrees 2003 ci-dessous disent "le md reflete deja" quand c'est le cas.

# ---------- Art. 21 ----------
- article: "21 (al. 1 nouveau)"
  statut: insere
  date: 2003-08-03
  source: "Loi n° 2003-709 du 1er août 2003, art. 20 (I)"
  jorf: JORFTEXT000000791289
  texte_actuel: |
    Les associations peuvent se former librement.

    Une association dont le but ne vise pas une entreprise économique acquiert la capacité de
    jouissance des droits par l’inscription au registre des associations du tribunal compétent.
  texte_actuel_officiel: false
  note: "Alinéa inséré 'au début' de l'article 21 : 'Les associations peuvent se former librement.' Absent du md. Le second alinéa reprend la traduction du md (non vérifiée contre la consolidation Légifrance, dont le libellé peut différer : 'tribunal d'instance', 'capacité juridique'). Publication JORF 2 août 2003, entrée en vigueur le lendemain. Relu en entier via get_decision."
  confiance: haute
- article: "21 (al. 3 nouveau)"
  statut: modifie
  date: 2019-03-25
  source: "Loi n° 2019-222 du 23 mars 2019, art. 105 (I)"
  jorf: JORFTEXT000038261631
  texte_actuel: |
    Les associations peuvent se former librement.

    Une association dont le but ne vise pas une entreprise économique acquiert la capacité de
    jouissance des droits par l’inscription au registre des associations du tribunal compétent.

    Les registres des associations et les registres des associations coopératives de droit local peuvent être tenus sous forme électronique dans les conditions définies aux articles 1366 et 1367 du code civil.
  texte_actuel_officiel: false
  note: "CORRECTION de la 1re passe : le texte en vigueur doit comprendre l'alinéa 'Les associations peuvent se former librement' (loi 2003, art. 20 I), omis auparavant. Alinéa de 2019 copié du JORF (art. 105 I, texte relu via get_law_article), pas de traduction officielle. Entrée en vigueur le lendemain de la publication (JORF 24 mars 2019)."
  confiance: haute
- article: "21 (al. 4 nouveau)"
  statut: modifie
  date: 2023-01-01
  source: "Loi n° 2021-1109 du 24 août 2021, art. 23 (I et II) ; Arrêté du 21 décembre 2022 (JORFTEXT000046820396), art. 4"
  jorf: JORFTEXT000043964778
  texte_actuel: |
    Les associations peuvent se former librement.

    Une association dont le but ne vise pas une entreprise économique acquiert la capacité de
    jouissance des droits par l’inscription au registre des associations du tribunal compétent.

    Les registres des associations et les registres des associations coopératives de droit local peuvent être tenus sous forme électronique dans les conditions définies aux articles 1366 et 1367 du code civil.

    Le registre des associations inscrites dans les départements du Bas-Rhin, du Haut-Rhin et de la Moselle et le registre des associations coopératives de droit local sont tenus, sous le contrôle du juge, par le greffe du tribunal judiciaire, selon un modèle fixé par arrêté du ministre de la justice. Ils sont tenus sous forme électronique, dans les conditions définies aux articles 1366 et 1367 du code civil, et sont rendus accessibles sous cette forme dans un standard ouvert, aisément réutilisable et exploitable par un système de traitement automatisé.
  texte_actuel_officiel: false
  note: "Texte de l'alinéa relu dans la loi 2021-1109 art. 23 (I) ; entrée en vigueur à une date fixée par arrêté, au plus tard le 1er janvier 2023 (art. 23 II) ; l'arrêté du 21 décembre 2022 la fixe au 1er janvier 2023 (selon 1re passe). La loi dit 'complété par un alinéa' alors que l'alinéa 2019 (électronique, mêmes références 1366/1367) existe déjà : cumul littéral reproduit, redondance probable, consolidation Légifrance à vérifier. Entrée du 2021-08-26 pour la publication, 2023-01-01 pour l'application."
  confiance: moyenne


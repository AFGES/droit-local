# ---------- Art. 42 ----------
- article: "42"
  statut: remplace
  date: 2003-08-03
  source: "Loi n° 2003-709 du 1er août 2003, art. 20 (III)"
  jorf: JORFTEXT000000791289
  texte_actuel: |
    Lorsque l’association est dans l’impossibilité de faire face au passif exigible avec son actif
    disponible, la direction doit requérir l’ouverture de la procédure de redressement ou de liquidation
    judiciaires. En cas de retard dans le dépôt de la demande d’ouverture, les membres de la direction
    auxquels une faute est imputable sont responsables envers les créanciers du dommage qui en
    résulte. Ils sont tenus comme débiteurs solidaires.
  texte_actuel_officiel: false
  note: "Le md reflète DÉJÀ le texte de la loi 2003 (identique au mot près à l'exception de la typographie). Ce n'est donc pas une traduction officielle 2013 : texte français de 2003. Aucune modification postérieure trouvée (recherche 'article 42 du code civil local' : 0 résultat) ; renvoi à la procédure collective non réactualisé après les réformes 2008/2014/2021, non vérifié."
  confiance: haute

# ---------- Art. 43 ----------
- article: "43 (ancien al. 2)"
  statut: abroge
  date: 2003-08-03
  source: "Loi n° 2003-709 du 1er août 2003, art. 21 ('le deuxième alinéa de l'article 43')"
  jorf: JORFTEXT000000791289
  texte_actuel: |
    Peut être privée de la capacité juridique l’association qui compromet l’intérêt public par
    une résolution illégale de l’assemblée de ses membres ou par des agissements illicites de la
    direction.

    Peut être privée de la capacité juridique l’association dont la capacité se fonde sur une
    concession, lorsqu’elle poursuit un but autre que celui établi dans les statuts.
  texte_actuel_officiel: false
  note: "CORRECTION de la 1re passe (qui ne l'avait pas vu). Le texte pré-2003 avait 3 alinéas (le second, supprimé, visait l'association à but politique, social-politique ou religieux : source secondaire, PPL Sénat 97-189 et traduction IDLAM). Le md n'a que 2 alinéas (illégalité ; concession) = déjà l'état post-2003. Il n'y a donc pas de modification restant à appliquer pour 2003, mais le md n'est pas la traduction 2013 brute."
  confiance: moyenne
- article: "43 (al. 1)"
  statut: abroge
  date: 2015-07-25
  source: "Ordonnance n° 2015-904 du 23 juillet 2015, art. 2 (1°)"
  jorf: JORFTEXT000030921208
  texte_actuel: |
    Peut être privée de la capacité juridique l’association dont la capacité se fonde sur une
    concession, lorsqu’elle poursuit un but autre que celui établi dans les statuts.
  texte_actuel_officiel: false
  note: "Le premier alinéa de l'article 43 (md) est abrogé ; reste l'alinéa sur les associations à capacité fondée sur une concession (devenu alinéa unique). Articulation 2003/2015 vérifiée : 2003 abroge le 'deuxième alinéa' du texte alors à 3 alinéas (politique), 2015 abroge le 'premier alinéa' (illégalité) ; pas de recouvrement. L'alinéa restant est sans objet pratique (les concessions n'existent plus, art. 23 et 44 abrogés). Lendemain de la publication (JORF 24 juillet 2015)."
  confiance: haute

# ---------- Art. 54 ----------
- article: "54"
  statut: remplace
  date: 2003-08-03
  source: "Loi n° 2003-709 du 1er août 2003, art. 20 (IV)"
  jorf: JORFTEXT000000791289
  texte_actuel: |
    Seul le patrimoine affecté à l’association non inscrite garantit les dettes contractées
    au nom de cette association. Toutefois, l’auteur d’actes juridiques accomplis envers les tiers au nom
    d’une telle association est tenu personnellement ; si ces actes sont accomplis par plusieurs
    personnes, celles-ci sont tenues comme débiteurs solidaires. Pour le surplus, il y a lieu
    d’appliquer les règles régissant la société civile en participation.
  texte_actuel_officiel: false
  note: "Le md reflète DÉJÀ le texte de la loi 2003 (identique). Texte français de 2003, pas traduction officielle 2013. Pas de modification postérieure trouvée."
  confiance: haute

# ---------- Art. 61 ----------

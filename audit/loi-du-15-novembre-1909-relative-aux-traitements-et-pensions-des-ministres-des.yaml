- article: "10"
  statut: modifie
  date: 2007-09-13
  source: "Décret n° 2007-1341 du 11 septembre 2007, art. 6"
  jorf: JORFTEXT000000279682
  texte_actuel: |
    Les ministres du culte reçoivent une pension de l'Etat conformément aux dispositions en vigueur pour les fonctionnaires d'Alsace-Lorraine, lorsqu'après dix années au moins de service, ils deviennent d'une façon durable par suite d'une infirmité corporelle ou de l'affaiblissement de leurs facultés physiques ou intellectuelles incapables d'exercer leur ministère et sont pour cette raison mis à la retraite. Les dispositions des articles 36, 39 de la loi sur le statut des fonctionnaires d'Empire seront appliquées par analogie avec cette différence que, dans le cas de l'article 39, il appartient au Ministère d'accorder la pension.

    La mise à la retraite est prononcée par l'autorité qui est compétente pour prononcer la destitution du ministre du culte ; l'approbation du ministre de l'intérieur est nécessaire.

    Lorsqu'un pasteur d'une des églises protestantes qui a occupé cet emploi pendant une année au moins est devenu pasteur auxiliaire rétribué sur le budget, sa pension sera calculée sur la base du traitement qu'il touchait en dernier lieu dans l'emploi de pasteur. S'appliquent aux ministres des cultes désignés à l'article 1er les dispositions des articles 5 à 7 de l'ordonnance du Statthalter du 16 mars 1910 relative à la fixation de l'ancienneté de traitement et de l'ancienneté de pension des ministres du culte.

    Le Ministère peut, après avis des supérieurs de l'intéressé, laisser à un ministre du culte relevé de ses fonctions par mesure disciplinaire une partie de sa pension légale conformément à l'article 75, dernier alinéa de la loi sur le statut des fonctionnaires. La même mesure peut être prise par le Ministère, après avis des supérieurs de l'intéressé, à l'égard d'un ministre du culte qui a été régulièrement relevé de ses fonctions sans procédure disciplinaire.

    Les dispositions relatives au payement des pensions des fonctionnaires pour le trimestre qui suit le mois du décès (art. 69 de la loi sur le statut des fonctionnaires) seront appliquées par analogie.
  texte_actuel_officiel: false
  note: "Reconstitution : remplacement de « sur la Caisse d'Alsace-Lorraine » par « de l'Etat » ; 3e phrase (approbation du Statthalter) ramenée à « l'approbation du ministre de l'intérieur est nécessaire » ; 4e, 5e et 6e phrases supprimées (calcul de la pension : 400 marks logement, indemnités, émoluments des chapelains et vicaires) ; 8e phrase réécrite (renvoi aux articles 5 à 7 de l'ordonnance du 16 mars 1910). Décompte des phrases vérifié (2e passe) contre le texte du décret 2007-1341, art. 6, et contre la traduction 2013 : 3e phrase = « La mise à la retraite... est nécessaire », 4e à 6e = calcul avec 400 marks, indemnités et émoluments des chapelains/vicaires, 8e = « Les dispositions relatives au temps de service... arrêtées par le Statthalter »."
  confiance: haute

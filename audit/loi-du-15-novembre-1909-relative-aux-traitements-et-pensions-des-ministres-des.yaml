- article: "7"
  statut: modifie
  date: 2007-09-13
  source: "Décret n° 2007-1341 du 11 septembre 2007, art. 3"
  jorf: JORFTEXT000000279682
  texte_actuel: |
    Les traitements, allocations et suppléments de traitement sont payés par trimestre et d'avance.

    Le droit au traitement prend naissance du jour de l'entrée en fonction ; toutefois, si la nomination est soumise à l'agrément ou à la confirmation du Gouvernement, il ne peut prendre naissance avant cet agrément ou cette confirmation. Le passage à un échelon de traitement plus élevé a lieu au début du trimestre qui suit celui où l'intéressé a atteint l'ancienneté de service qui lui donne droit à ce passage.

    Le droit au traitement est suspendu lorsque le ministre du culte est provisoirement relevé de ses fonctions, ou lorsque, sauf le cas de maladie et sans congé de l'autorité supérieure, il n'exerce pas son ministère; pour un congé de plus de six semaines, l'autorisation du Ministère est nécessaire.

    Lorsque le droit au traitement est suspendu, le Ministère peut décider que le traitement, l'allocation ou le supplément continuera à être payé en tout ou en partie et qu'il n'y a pas lieu de faire restituer les sommes touchées l'avance.
  texte_actuel_officiel: false
  note: "Suppression des mots « l'âge ou » (avancement à l'ancienneté seulement)."
  confiance: haute

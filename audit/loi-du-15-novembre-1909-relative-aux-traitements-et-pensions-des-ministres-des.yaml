  texte_actuel: |
    Les ministres des cultes régis par la loi du 18 germinal an X et l'ordonnance royale du 25 mai 1844 perçoivent un traitement de l'Etat selon un classement indiciaire fixé par décret et par référence aux indices prévus pour le classement hiérarchique des grades et emplois des personnels civils et militaires de l'Etat.
  texte_actuel_officiel: false
  note: "Les articles 1er à 6 (barèmes en marks, vicaires, chapelains, pasteurs, rabbins) sont remplacés par ce seul article 1er. Classement indiciaire fixé par le décret n° 2007-1445 du 8 octobre 2007 (JORFTEXT000000794003, relu en 2e passe : art. 1 à 4, classement par référence au décret du 10 juillet 1948 et aux décrets du 29 septembre 2005, échelonnements fixés par arrêtés conjoints ; le tableau de l'art. 2 n'est pas restitué par la base)."
  confiance: haute

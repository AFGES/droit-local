- article: "42 à 47 (pénalités)"
  statut: remplace
  date: 2006-07-01
  source: "Code général de la propriété des personnes publiques, art. L. 2124-19 (ordonnance n° 2006-460 du 21 avril 2006 ; ancien art. 227 du code du domaine public fluvial) : la loi locale du 2 juillet 1891, avec les modifications de la loi du 22 avril 1902, s'applique aux cours d'eau et canaux domaniaux « à l'exception des articles relatifs aux pénalités »"
  jorf: JORFTEXT000000456141
  texte_actuel: ""
  texte_actuel_officiel: false
  note: "Pour les cours d'eau et canaux domaniaux de l'Etat en Alsace-Moselle, L. 2124-19 maintient la loi de 1891 mais exclut les articles relatifs aux pénalités (art. 42 à 46 ; l'art. 47 sur la suppression des ouvrages n'est pas clairement une pénalité). Le texte en vigueur à la place n'a pas été identifié (CG3P, L. 2132-x non lu). Pour les cours d'eau non domaniaux, aucun texte lu ; sanctions en marks à lire avec prudence."
  confiance: moyenne
- article: "11 (al. 3)"

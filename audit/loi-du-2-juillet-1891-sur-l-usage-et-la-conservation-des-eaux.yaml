- article: "38, 41 (digues domaniales)"
  statut: modifie
  date: 2023-11-24
  source: "Décret n° 2023-1074 du 21 novembre 2023, art. 6 (le 1° de L. 2124-19 CG3P, qui maintient la loi locale de 1891, ne fait pas obstacle au transfert des digues domaniales en Moselle et en Alsace)"
  jorf: JORFTEXT000048449330
  texte_actuel: ""
  texte_actuel_officiel: false
  note: "Le décret transfère la gestion des digues domaniales aux communes et groupements compétents (GEMAPI). Les art. 38 et 41 (entretien des digues d'inondation du Rhin par l'Etat) et 30 (associations syndicales pour digues) concernent des digues : dérogation implicite probable pour les digues domaniales mises à disposition. Le décret ne cite pas les articles de la loi de 1891 ; rattachement article par article non établi."
  confiance: a_verifier

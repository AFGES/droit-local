  texte_actuel_officiel: false
  note: "Renvoi à la loi du 21 juin 1865 sur les associations syndicales, abrogée au 2004-07-02 ; les associations syndicales sont régies par l'ordonnance 2004-632. Lecture « loi de 1865 = ordonnance 2004 » : interprétation, non texte officiel."

- article: "30"
  statut: modifie
  date: 2004-07-02
  source: "Ordonnance n° 2004-632 du 1er juillet 2004, art. 58 et 60 I"
  jorf: JORFTEXT000000623191
  texte_actuel: ""
  texte_actuel_officiel: false
  note: "Renvoi à l'art. 1 n° 1 et 2 de la loi du 21 juin 1865, abrogée. La création d'associations syndicales par arrêté du Statthalter (désormais autorité administrative) et leur régime relèvent désormais de l'ordonnance 2004-632 pour les associations constituées sous la loi de 1865 ; le sort des associations créées directement sur le fondement de l'art. 30 de la loi de 1891 n'a pas été trouvé."
  confiance: a_verifier

# Aucun texte ne modifie formellement ce règlement ; les entrées ci-dessous décrivent des effets de textes modifiant les textes auxquels il renvoie. Textes actuels non reconstitués.
- article: "A.II 2° et 3° (oratoires particuliers, chapelles domestiques) et B.II (églises d'établissements et chapelles domestiques)"
  statut: abroge
  date: 2019-12-12
  source: "Décret n° 2019-1330 du 10 décembre 2019, art. 6, 2° (abrogation du décret impérial du 22 décembre 1812 relatif au mode d'autorisation des chapelles domestiques et des oratoires particuliers) et art. 6, 4° (art. 63 de l'ordonnance du 25 mai 1844)"
  jorf: JORFTEXT000039472929
  texte_actuel: ""
  texte_actuel_officiel: false
  note: "La notice du décret précise qu'il « supprime enfin des dispositions soumettant à un régime d'autorisation [...] l'ouverture des chapelles domestiques et oratoires particuliers relevant des cultes statutaires ». Les parties du règlement fondées sur le décret de 1812 (autorisation d'ouverture des oratoires particuliers et domestiques, art. 2 et 8 cités) sont donc privées de base ; le règlement lui-même n'est pas abrogé formellement. Entrée en vigueur : lendemain de publication au JORF du 11 décembre 2019."
  confiance: moyenne
- article: "A (autorisation par ordonnance du Statthalter) et B.I (églises filiales)"
  statut: modifie
  date: 2001-01-14
  source: "Décret n° 2001-31 du 10 janvier 2001, art. 3, II (décret du 30 septembre 1807, art. 12 : chapelles ou annexes autorisées par arrêté préfectoral après avis de l'évêque), art. 13 (décret du 19 mars 1859, art. 1er : arrêté du ministre de l'intérieur), art. 14, VIII (ordonnance de 1844, art. 63 : arrêté préfectoral) ; décret 2019-1330, art. 6, 4° et art. 7 (préfet territorialement compétent ; art. 63 de l'ordonnance de 1844 et art. 2 à 4 du décret de 1859 abrogés)"
  jorf: JORFTEXT000000754516
  texte_actuel: ""
  texte_actuel_officiel: false
  note: "Effet implicite : l'autorisation d'ouverture de lieux de culte « par ordonnance de l'autorité suprême (Statthalter) » est remplacée par un arrêté préfectoral (catholique : décret de 1807 art. 12 ; protestant : décret de 1859 art. 1er, préfet depuis 2019 ; israélite : art. 63 de l'ordonnance de 1844, abrogé en 2019). Aucun texte ne réécrit le règlement. A vérifier précisément avant de qualifier chaque passage."
  confiance: a_verifier

# Source lue : Conseil constitutionnel, décision n° 2025-1145 QPC du 2 juillet 2025 (JORFTEXT000051837257), §§ 2, 3, 16-20 et dispositif.
# Le texte de ces alinéas n'est pas dans le md : texte_origine = citation de la traduction officielle (décret 2013-395) reproduite par la décision (§ 2 et 3).
- article: "9 (al. 2)"
  statut: inconstitutionnel_differe
  date: 2026-07-01
  source: "Conseil constitutionnel, décision n° 2025-1145 QPC du 2 juillet 2025, art. 1er et 2, §§ 18 à 20"
  jorf: JORFTEXT000051837257
  texte_origine: |
    A la demande seront jointes toutes pièces justificatives constatant l’âge et les bonne vie et mœurs de la personne présentée, ainsi que son aptitude à l’enseignement qui doit lui être confié
  texte_actuel: ""
  texte_actuel_officiel: false
  note: "Second alinéa de l'article 9 déclaré contraire à la Constitution (liberté de l'enseignement, régime d'autorisation d'engager un maître insuffisamment encadré, § 15). Abrogation reportée au 2026-07-01 (§ 19) ; mesures antérieures non contestables sur ce fondement (§ 20). Le dispositif (art. 2) renvoie les effets aux §§ 18-20 pour « la déclaration d'inconstitutionnalité de l'article 1er » (article 1er de la décision, qui vise les trois dispositions). Aucune loi de remplacement trouvée au JORF au 2026-11-19. Le md ne contient pas l'article 9 (seul l'article 10 a y figure)."
  confiance: haute

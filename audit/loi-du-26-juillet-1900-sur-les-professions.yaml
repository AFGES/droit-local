- article: "35"
  statut: modifie
  date: 1996-07-06
  source: "Loi n° 96-603 du 5 juillet 1996, art. 16 (V)"
  jorf: JORFTEXT000000193678
  texte_actuel: |
    L’exercice de la profession de professeur de gymnastique ou de natation ainsi que
    l’exploitation d’établissements de bains devra être interdit quand il existera des faits d’où il
    résulte que le requérant ne présente pas, en ce qui concerne l’exercice de ces professions, les
    garanties suffisantes.
    Devront être d’interdites, pour les mêmes raisons, le commerce d’oiseaux vivants, le
    commerce de la dynamite ou d’autres matières explosives, et le commerce de billets de
    loteries et de tombolas ou de certificats provisoires ou coupures de ces billets.
    Il en sera de même des agences de courtiers pour opérations immobilières ou de prêts, des
    agences matrimoniales et du métier de commissaire-priseur. La vente aux enchères
    d’immeubles est interdite à ceux qui exercent le métier de commissaire-priseur, à moins qu’ils
    n’aient été nommés en cette qualité par les autorités de l’Etat ou des communes ou les
    corporations, compétentes à cet effet (art. 36).
    Le commerce de drogues et de préparations chimiques, destinées à servir de remèdes, doit être
    interdit quand la manière dont il est exercé met en péril la santé ou la vie du public. La vente
    au détail de la bière peut être interdite quand l’exploitant s’est rendu coupable de
    contraventions répétées aux dispositions de l’article 33.
    L’exercice de la profession d’entrepreneur en bâtiment et d’architecture, ainsi que l’exercice
    d’une branche quelconque de l’industrie du bâtiment, devra être interdit, s’il existe des faits
    d’où il résulte que l’exploitant ne présente pas les garanties suffisantes pour l’exercice de cette
    profession. Avant de prononcer cette interdiction, il y aura lieu, conformément aux
    dispositions qu’édictera à cet effet l’autorité centrale de l’Etat particulier, d’entendre les experts
    qui auront été désignés d’avance par l’autorité administrative supérieure pour donner, en cas
    de besoin, des avis de cette nature. Lorsqu’il s’agit d’avis à donner sur des exploitations ayant
    le caractère de celles des artisans, la désignation a lieu après avis de la chambre des artisans
    de la circonscription.
    Lorsque l’interdiction a été prononcée, l’autorité centrale de l’Etat particulier ou toute autorité
    qu’elle désignera peut permettre la reprise de l’exploitation quand il s’est écoulé au moins un
    an depuis l’interdiction.
    Les personnes qui entreprennent une des exploitations indiquées au présent article doivent
    faire à l’autorité compétente une déclaration de l’ouverture de leur exploitation. Si l’autorité compétente estime que l’activité déclarée est susceptible d’être interdite en vertu des dispositions ci-dessus, elle transmet cette déclaration au représentant de l’État pour décision. L’activité déclarée ne pourra être exercée avant qu’une décision n’ait été prise.
  note: "Le V de l'art. 16 de la loi 96-603 complète le dernier alinéa de l'art. 35 du code professionnel local par deux phrases (texte lu dans LEGI, versions de l'art. 16 de 1996 à 2023). Ajout antérieur à 2013, absent de la traduction de 2013. La loi 96-603 a été abrogée le 1er juillet 2023 par l'ordonnance n° 2023-208 (art. 5 II 3°, JORFTEXT000047358025) ; aucune reprise de ce V n'a été trouvée dans le code de l'artisanat. Une abrogation de la disposition modificative n'efface en principe pas le texte déjà inséré : les deux phrases restent donc a priori en vigueur. Les décrets 98-247 (art. 15, version 2017) puis 2017-861 (art. 15) y renvoient (« sous réserve du V de l'article 16 ... et de l'article 35 du code professionnel local »)."
  confiance: moyenne
# --- Seconde passe (2026-11-19) : chambres de métiers d'Alsace et de la Moselle (art. 103 à 103 n), art. 133 a, art. 35 (danse). Textes lus en entier via get_decision.
- article: "103 a"
  statut: remplace
  date: 2008-12-08
  source: "Décret n° 2008-1275 du 5 décembre 2008, art. 2 (publié au JORF du 7 décembre 2008)"
  jorf: JORFTEXT000019876121
  texte_actuel: |
    Le nombre d'élus à la chambre de métiers et, le cas échéant, dans les sections territoriales ou professionnelles mentionnées à l'article 103 est fixé par les statuts.
  texte_actuel_officiel: false
  note: "L'article 103 a est remplacé en entier. Modifications antérieures, devenues sans objet : décret n° 99-727 du 25 août 1999 (art. 1er, I : au 2e alinéa, « dans l'ordre de leur élection » remplacé par « compte tenu de leur activité professionnelle », JORFTEXT000000577930) puis décret n° 2004-897 du 27 août 2004 (art. 1er : suppression de « compte tenu de leur activité professionnelle », JORFTEXT000000443519). Le libellé de la traduction 2013 (« dans l'ordre de l'élection ») diffère de celui visé par ces décrets. Le décret 2008-1275 ne prévoit pas de report d'application dans son texte."
  confiance: moyenne
- article: "apres-103 a (103 a1)"
  statut: insere
  date: 2008-12-08
  source: "Décret n° 2008-1275 du 5 décembre 2008, art. 3"
  jorf: JORFTEXT000019876121
  texte_actuel: |
    Art. 103 a1. - I. - Ont la qualité d'électeur les personnes physiques et morales ayant le lieu de leur principal établissement dans le ressort de la chambre concernée et immatriculées au registre des entreprises prévu au IV de l'article 19 de la loi n° 96-603 du 5 juillet 1996 relative au développement et à la promotion du commerce et de l'artisanat depuis au moins six mois à la date de clôture de scrutin.
    Les personnes morales sont représentées par l'un de leurs dirigeants sociaux, sauf si elles désignent une autre personne à cet effet.
    Le chef d'entreprise individuelle peut se faire remplacer par son conjoint actif dans l'entreprise. Est considéré comme conjoint actif dans l'entreprise le conjoint au sens du I de l'article L. 121-4 du code de commerce.
    II. - Les conditions requises pour participer aux élections sont fixées au II de l'article 5 du décret n° 99-433 du 27 mai 1999 relatif à la composition des chambres de métiers et de l'artisanat et à leur élection.
  texte_actuel_officiel: false
  note: "Texte tel que publié en 2008. La loi 96-603 a été abrogée le 1er juillet 2023 (ordonnance 2023-208) et les références (registre des entreprises, L. 121-4 du code de commerce, décret 99-433 modifié/abrogé) ont pu évoluer : état actuel du texte non vérifié."
  confiance: moyenne
- article: "103 b"
  statut: remplace
  date: 2008-12-08
  source: "Décret n° 2008-1275 du 5 décembre 2008, art. 4"
  jorf: JORFTEXT000019876121
  texte_actuel: |
    Art. 103 b. - I. - Sont éligibles les chefs d'entreprise individuelle qui :
    1° Remplissent les conditions fixées à l'article 6 du décret du 27 mai 1999 précité ;
    2° Ne sont pas soumis, par décision judiciaire, à des mesures restreignant la libre disposition de leurs biens ;
    3° Et sont proposés par leurs corporations.
    Lorsque, dans la circonscription concernée, un ou plusieurs métiers relevant de l'artisanat ne sont pas organisés en corporation, le préfet du département du siège de la chambre de métiers assimile à une corporation au sens du présent article d'autres organisations professionnelles constituées en vue de défendre les intérêts d'un même métier ou de métiers d'une même branche d'activité et justifiant l'immatriculation des trois quarts de leurs membres au moins au registre des entreprises.
    Lorsqu'elle exerce plusieurs activités, une personne ne pourra être proposée que par la corporation ou l'organisation professionnelle dont elle relève correspondant à son activité dominante.
    II. - Peuvent présenter un candidat les personnes morales qui satisfont aux conditions fixées aux II et III de l'article 6 du décret du 27 mai 1999 précité et au 2° du I du présent article.
    III. - Sont éligibles les représentants des personnes morales et les conjoints actifs mentionnés au I de l'article 103 a1 qui satisfont personnellement aux conditions fixées aux I et III de l'article 6 du décret du 27 mai 1999 précité et aux 2° et 3° du I du présent article.
  texte_actuel_officiel: false
  note: "Remplacement intégral (les conditions d'éligibilité de la traduction 2013 : échevin, 30 ans, métier depuis 3 ans, droit de former des apprentis, ne sont plus en vigueur). Chaîne antérieure : décret 99-727 du 25 août 1999 art. 1er II (remplacement, JORFTEXT000000577930) ; décret 2004-897 du 27 août 2004 art. 2 (modification du A, JORFTEXT000000443519 ; art. 2 annulé en partie, quant à la condition de nationalité, par CE 31 mai 2006, n° 273638 et 273639) ; décret 2007-233 du 20 février 2007 art. 1er (modification des A et B, JORFTEXT000000426770). Le renvoi à l'article 6 du décret 99-433 du 27 mai 1999 vise un texte depuis modifié/abrogé (décret 2021-168) : état actuel des renvois non vérifié."
  confiance: moyenne
- article: "103 c"
  statut: remplace
  date: 2008-12-08
  source: "Décret n° 2008-1275 du 5 décembre 2008, art. 5"
  jorf: JORFTEXT000019876121
  texte_actuel: |
    Art. 103 c. - Les membres des chambres de métiers sont élus pour cinq ans et sont rééligibles.
    Ils sont renouvelés intégralement.
    Lorsqu'ils atteignent l'âge de soixante-cinq ans en cours de mandat, les membres poursuivent leur mandat jusqu'au renouvellement suivant.
    Les membres titulaires empêchés ou dont le siège devient vacant sont remplacés par des suppléants. En cas de vacance, ceux-ci achèvent le mandat des membres titulaires.
    Les dispositions du premier alinéa de l'article 94 a ainsi que celles de l'article 94 b sont applicables aux membres des chambres de métiers.
  texte_actuel_officiel: false
  note: "Mandat de cinq ans (au lieu de six ans, renouvellement par moitié tous les trois ans dans la traduction 2013). Chaîne : décret 99-727 art. 1er III (5 ans, renouvellement intégral) puis remplacement par le décret 2008-1275. Décret 2009-1399 du 17 novembre 2009 (prorogation des mandats) vise l'art. 103 c3 sans le modifier."
  confiance: moyenne

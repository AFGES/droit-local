  statut: abroge
  date: 1996-07-21
  source: "Décret n° 96-643 du 16 juillet 1996, art. 1er (publié au JORF du 20 juillet 1996)"
  jorf: JORFTEXT000000547822
  texte_actuel: ""
  texte_actuel_officiel: false
  note: "« Le 5° de l'article 103 (g) du code professionnel local susvisé est abrogé. » C'est le 5° « l'élection du secrétaire. Si ses fonctions lui sont conférées pour plus de six ans, son élection sera soumise à l'approbation de l'autorité de surveillance ». Antérieur à 2013, présent dans la traduction. Date d'entrée en vigueur déduite de la publication (lendemain), non lue dans un article d'application."

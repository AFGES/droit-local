# Seconde passe d'audit (2026-11-19). Lecture par transfert de competence : loi 2019-222 art. 95 (suppression du tribunal d'instance, titre II du livre II du COJ abroge). Aucun texte ne modifie litteralement cette loi.
- article: "7 b (al. 2)"
  statut: modifie
  date: 2020-01-01
  source: "Loi n° 2019-222 du 23 mars 2019, art. 95 (I, 42°) : le titre II du livre II du code de l'organisation judiciaire (tribunal d'instance) est abrogé ; compétences au tribunal judiciaire"
  jorf: JORFTEXT000038261631
  texte_actuel: |
    La surveillance d'une fondation, qui, aux termes de l'acte de fondation, est exclusivement
    affectée aux intérêts des membres d'une ou de plusieurs familles déterminées, est exercée par le
    tribunal judiciaire dans le ressort duquel la fondation a son siège ; la surveillance de toute autre
    fondation est exercée par le préfet du département. Conformément à ces prescriptions, le
    Ministère désigne l'autorité compétente ; il peut charger de la surveillance une autorité
    administrative autre que le préfet du département.
  texte_actuel_officiel: false
  note: "« tribunal d'instance » se lit « tribunal judiciaire » depuis le 1er janvier 2020. L'art. L. 215-6 COJ ne cite pas expressément les fondations ; le transfert résulte de la compétence générale du tribunal judiciaire (L. 211-3). Reconstitution, hors traduction officielle de 2013. Voir aussi les entrées du code civil local (art. 80 et suivants)."
  confiance: moyenne

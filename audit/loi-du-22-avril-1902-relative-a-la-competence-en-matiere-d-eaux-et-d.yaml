- article: "2"
  statut: modifie
  date: 2004-07-02
  source: "Ordonnance n° 2004-632 du 1er juillet 2004, art. 58 (abrogation de la loi du 21 juin 1865 relative aux associations syndicales) et art. 60 I (les associations constituées sous la loi de 1865 sont régies par l'ordonnance)"
  jorf: JORFTEXT000000623191
  texte_actuel: ""
  texte_actuel_officiel: false
  note: "Le renvoi à la loi du 21 juin 1865 vise un texte abrogé depuis le 2004-07-02. Les renvois aux art. 1 et 5 de la loi du 11 mai 1877 et à la loi du 14 avril 1884 (chemins ruraux) n'ont pas été vérifiés. Le sens de l'article (le ministère peut attribuer à d'autres autorités des compétences du préfet) n'est pas affecté par cette recherche."
  confiance: moyenne

# Modification antérieure à septembre 2013, non reflétée par la traduction de 2013. Aucune modification postérieure trouvée.
- article: "7"
  statut: modifie
  date: 2001-06-23
  source: "Arrêté du 29 mai 2001 modifiant l'arrêté du 19 mars 1910 portant règlement d'exécution de la loi locale du 15 novembre 1909, art. 1er"
  jorf: JORFTEXT000000590423
  texte_actuel: |
    Si un ministre du culte doit être mis à la retraite avec son consentement pour cause d'incapacité de service, il incombe à l'autorité compétente de demander l'agrément du ministère avant de décider l'admission à la retraite. Dans la demande d'agrément, l'autorité aura à déclarer qu'elle considère, en son âme et conscience, le ministre du culte en question comme incapable de continuer à remplir les devoirs de sa charge ; de plus il y a lieu d'indiquer le jour à partir duquel l'admission à la retraite aura à prendre effet. La demande d'agrément devra être appuyée du consentement du ministre du culte, et, s'il n'a pas encore accompli l'âge de 60 ans, d'une attestation d'un médecin assermenté. Quant aux rabbins, la déclaration prévue à la deuxième phrase doit être faite par le consistoire.

    La décision qui prononce l'admission à la retraite doit être remise au ministre du culte; une copie de la décision avec indication du jour de la remise à l'intéressé, sera adressée aussitôt au ministère, s'il y a lieu, avec la notification visée à l'article 1er, b).
  texte_actuel_officiel: false
  note: "L'arrêté de 2001 remplace « 65 » par « 60 » (le 65 résulte d'un arrêté du 6 mars 1978, visé par l'arrêté de 2001 comme ayant déjà modifié l'art. 7 ; non retrouvé dans la base JORF, qui avait remplacé 70). Publié au JORF du 23 juin 2001 ; l'arrêté vise « l'avant-dernière phrase du premier alinéa ». La traduction 2013 (md) porte encore « 70 ans »."
  confiance: haute

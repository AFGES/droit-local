# Seconde passe (2026-11-19). Livre III du code des assurances sociales (assurance accidents). Aucune modification formelle d'article du code local trouvée.
- article: "Première partie (assurance dans les entreprises industrielles, art. 537 et suivants)"
  statut: remplace
  date: 1998-04-16
  source: "Indices seulement : code de la sécurité sociale L. 181-1 5° (loi n° 98-278 du 14 avril 1998, art. 1er et 2), L. 242-7-1, L. 434-19, L. 482-1 à L. 482-3 ; décret 2010-753 du 5 juillet 2010 (D. 242-29 s.)"
  jorf: JORFTEXT000000204401
  texte_actuel: ""
  texte_actuel_officiel: false
  note: "Aucun texte abrogeant expressément cette partie n'a été trouvé. Indices lus : (1) CSS L. 181-1 5° ne maintient plus, pour l'assurance accidents du travail et maladies professionnelles, que les dispositions particulières de L. 242-7-1, L. 434-19 et L. 482-1 à L. 482-3 ; (2) CSS L. 242-7-1 (loi 98-278 art. 2) prévoit le « passage » des règles de tarification locales aux règles du régime général ; (3) CSS D. 242-29 à D. 242-41 (section 8, dispositions propres au Haut-Rhin, Bas-Rhin et Moselle) fixent la cotisation AT-MP par établissement dans le cadre du régime général ; (4) CSS L. 141-3 (expertise médicale) ne vise le régime local qu'« en ce qui concerne les accidents du travail en agriculture » ; (5) CSS L. 434-19 maintient seulement l'art. 612 du code local (paiement des rentes) et L. 482-1 vise encore la limite d'âge des rentes d'orphelin du code local. Conclusion prudente : le régime local de la première partie ne s'applique plus aux salariés non agricoles pour les accidents récents (régime général), mais certaines règles (art. 612, anciennes rentes) subsistent. Statut « remplace » provisoire, à confirmer sur un texte de transition (non lu)."
  confiance: a_verifier

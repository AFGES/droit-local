# Audit modifications depuis sept. 2013 jusqu'au 2026-11-19 (perimetre commerce-professions). Sources lues via justicelibre (JORF/LEGI).
- article: "tout"
  statut: modifie
  date: 2019-05-24
  source: "Loi n° 2019-486 du 22 mai 2019, art. 3 (modifiant l'art. 8 de la loi du 1er juin 1924 portant introduction des lois commerciales françaises)"
  jorf: JORFTEXT000038496102
  texte_actuel: ""
  note: "Modification indirecte, pas du texte de 1889 lui-même : l'art. 8 de la loi du 1er juin 1924 substitue le Journal officiel au Reichsanzeiger et « aux autres journaux prescrits par la loi locale » ; depuis le 24 mai 2019 les insertions se font « au Journal officiel ou sur un support habilité à recevoir des annonces légales » (avant : « aux autres journaux destinés à recevoir les annonces légales »). Concerne les mentions de publication dans les journaux des articles 6, 12, 51, 82, 90, 95 et 156 de la loi du 1er mai 1889. Aucune modification formelle de la loi de 1889 elle-même n'a été trouvée dans le JORF depuis 2013."
  confiance: moyenne

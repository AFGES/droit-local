# Sources : loi du 1er juin 1924 art. 9 (JORFTEXT000000869866, lois commerciales) ;
# loi du 1er juin 1924 art. 11 (LEGITEXT000006069443, législation civile).
# Les mots ambigus (« allemand », « province », « cercle ») ne sont pas remplacés seuls.
- {orig: "Etat allemand", new: "Etat français"}
- {orig: "Empire allemand", new: "Etat français"}
- {orig: "président de province", new: "préfet"}
- {orig: "président du département", new: "préfet"}
- {orig: "président de département", new: "préfet"}
- {orig: "président du district", new: "préfet"}
- {orig: "président de district", new: "préfet"}
- {orig: "directeur de cercle", new: "sous-préfet"}
- {orig: "directeur d’arrondissement", new: "sous-préfet"}
- {orig: "territoire allemand", new: "territoire français"}
- {orig: "nationalité allemande", new: "nationalité française"}
- {orig: "établissements allemands", new: "établissements français"}
- {orig: "Banque d’Empire", new: "Banque de France"}
- {orig: "formes judiciaires", new: "formes notariées"}
# Marks sans montant : les marks sont remplacés par des francs (1 mark = 1,25 F).
- {orig: "(en marks)", new: "(en anciens francs)"}
- {orig: "des marks entiers", new: "des francs entiers"}
# Pfennigs sans montant : 1 pfennig = 1,25 centime.
- {orig: "de pfennigs", new: "de centimes"}
- {orig: "les pfennigs", new: "les centimes"}
